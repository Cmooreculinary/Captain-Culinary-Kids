# ============================================================
# Captain Culinary Kids — Render Blueprint
# ============================================================
# Two services: FastAPI backend + React static-site frontend.
# Connect this repo to Render and click "Apply Blueprint" to
# provision both services automatically.
#
# Env vars marked `sync: false` MUST be entered manually in
# the Render dashboard (never committed to source control):
#   - STRIPE_SECRET_KEY       (Stripe secret key — sk_live_...)
#   - STRIPE_WEBHOOK_SECRET   (Stripe webhook signing secret — whsec_...)
#   - EMERGENT_LLM_KEY        (optional, for future Gemma 4 AI narration)
# ============================================================

services:
  # ----------------------------------------------------------
  # Backend — FastAPI
  # ----------------------------------------------------------
  - type: web
    name: cck-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # CORS — restricts API access to the frontend origin
      - key: CORS_ORIGINS
        value: https://robot-chef-app.onrender.com

      # Frontend URL — used to build Stripe redirect URLs
      - key: FRONTEND_URL
        value: https://robot-chef-app.onrender.com

      # Stripe payment — set these manually in the Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Optional: Emergent LLM integration (future Gemma 4 / AI narration)
      - key: EMERGENT_LLM_KEY
        sync: false

  # ----------------------------------------------------------
  # Frontend — React static site
  # ----------------------------------------------------------
  - type: web
    name: robot-chef-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        # Render fills this with the backend service URL automatically.
        fromService:
          type: web
          name: cck-backend
          property: host
    # Single-page-app rewrites: serve index.html for all unknown routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /illustrations/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
